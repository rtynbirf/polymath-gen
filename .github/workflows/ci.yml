name: ci

# CI ПОЛИМАТ-ГЕН (волна 2026-11-08, W-AUD-11): установка пакета и тесты.
# Требование канона: код LLM-агента без прогона не считается выполненным.

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test — pip install -e . + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: "wave3 · рубрикатор самокритики: самопроба + демо-плато"
        run: |
          python3 wave3/critic_loop.py --selftest
          python3 wave3/critic_loop.py --demo
      - name: установка пакета и тестового инвентаря
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: тесты
        run: pytest tests/ -v
