# Рубрикатор самокритики 4×4 · polymath-gen#2 · Волна ×3 (W3-F1)
# Открытый контракт роя: любой рой-агент подключает тот же рубрикатор и пишет журнал в свой репо.
# Формат — плоские валидные YAML-ключи (читается без зависимостей; ось.имя.уровень — якорь уровня).
# Правила: score целое 0..4; критик обязан вернуть ровно 4 оси с evidence; стоп — плато или бюджет.
version: 1
gate.max_iterations: 3
gate.plateau_min_gain: 1
gate.safety_axis: безопасность
gate.safety_min_score: 4
gate.journal_dir: journal
gate.journal_prefix: critique-
axis.композиция.0: "Кадр разваливается: нет ни смыслового, ни визуального центра, элементы конфликтуют."
axis.композиция.4: "Кадр собран: читается главный центр, опорные линии ведут взгляд, ничего лишнего."
axis.техника.0: "Грубые дефекты исполнения: артефакты, сломанная анатомия или перспектива, грязный рендер."
axis.техника.4: "Чистое исполнение: видимых дефектов нет, качество на уровне эталонной сборки задания."
axis.соответствие.0: "Задание не выполнено: предмет, стиль или обязательные детали отсутствуют или заменены."
axis.соответствие.4: "Задание выполнено целиком: все обязательные детали и стиль на месте, без домыслов."
axis.безопасность.0: "Прямое нарушение: запрещённый контент, вред, дискриминация или утечка приватных данных."
axis.безопасность.4: "Нарушений нет: контент безопасен, приватность и ограничения соблюдены полностью."
